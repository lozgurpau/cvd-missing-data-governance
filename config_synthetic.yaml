# Synthetic example configuration. Same design settings as config.yaml; only data_dir, out_dir, columns_local, scale,
# n_jobs and data.synthetic differ. Results obtained on synthetic data have no scientific meaning.
# Tasarım kararları burada DEĞİŞTİRİLMEZ; yalnız ölçek, işçi sayısı ve isteğe bağlı analizler ayarlanır.

paths:
  data_dir: synthetic_data  # synthetic example files written by tools/make_synthetic.py (no real records)
  out_dir: out_synthetic    # outputs of the synthetic example (out_synthetic_mini/ at scale mini)
  raw_xlsx: raw_export.xlsx           # synthetic workbook in synthetic_data/ (generic name)
  columns_local: columns.example.yaml   # synthetic data use the generic column names (identity mapping)

data:
  synthetic: true           # true only for the synthetic example data (synthetic_data/, tools/make_synthetic.py): known-count,
                            # '7680' sheet equality, exclusion-threshold and input-checksum checks are skipped with a warning

scale: mini                 # mini | deneme | tam   (mini: pipeline test only)

compute:
  n_jobs: 1                 # parallel workers (override with --n-jobs)
  threads_per_model: 1      # LightGBM/XGBoost/CatBoost iç iş parçacığı (oversubscription önlemek için 1)
  seed: 20260101

design:                     # tasarım sabittir; buradaki değerler belgeleme amaçlıdır
  outer_repeats: 5
  outer_folds: 5
  inner_folds: 3
  inner_scoring: roc_auc
  mice_m: 5                 # S5: çoklu imputasyon sayısı (m)
  bootstrap_reps: 1000

blood_pressure:
  coding: kardiyolog_kurali # ana analiz: kardiyologla belirlenen kodlama kuralı (DATA_DICTIONARY.md); yalnız belgeleme
  measurement_only_arm: true   # A kolu: ölçüme dayanmayan 1.722 kod (1.679 belgeli hipertansiyon, 43 diğer kayıt) 'bilinmiyor' sayılır

sensitivity:
  leakage_sets: true        # sızıntı setleri
  proxy_group_cv: true      # tekrar başvuru vekiliyle gruplu CV
  missingness_mechanism: true   # eksiklik mekanizması (Little MCAR, δ-MNAR)
  shap_and_ablation: true   # shap kolu: SHAP önemi, kararlılık, dört setli ablasyon
  subgroups: true           # alt gruplar
  threshold_analysis: true  # eşik analizi ve karar eğrisi
  winsorization: true       # winsor sınırları
  clinical_baseline: true   # klinik baz model
  label_noise: true         # etiket gürültüsü (çoğunluk etiketi; tanı metni boş dışlama)
  exclusion_thresholds: true  # dışlama eşikleri (dışlamasız, ≥4, ≥8)
  learning_curve: true      # öğrenme eğrisi
  fixed_hyperparameters: true   # ortak hiperparametreler (ayarlamanın etkisi)
  # false ise ilgili kol koşmaz ve çıktısı üretilmez
  continuous_bp_ef: true    # sürekli sistolik BP ve EF (kısıtlı kübik spline) + referans kol
  age18_exclusion: true     # <18 yaş dışlama kolu (S1, S3, S7)
  shap_v2: true             # makalede bildirilen gösterge ablasyonu, kayıt düzeyi SHAP, etkileşim replikasyonu
optional:                       # üç bayrak da kodda okunur (false ise ilgili çıktı üretilmez)
  compute_cost_report: true     # → rapor/ana/hesap_maliyeti.csv
  missingness_simulation: true  # → duyarlilik/sim_*, rapor/ana/simulasyon_ozet.csv
  selective_prediction: true    # → rapor/ana/secici_tahmin.csv

report:                         # kullanım senaryosu çalışma noktaları
  operating_points:
    sensitivity: 0.90           # kodlama kalite kontrolü: duyarlılık ≥ 0,90
    ppv: 0.85                   # kohort oluşturma: PPV ≥ 0,85

shap_v2:                        # etkileşim replikasyonu
  interaction_n: 1000           # eğitim katlamasından alt örneklem (ve dış test katlamasında en çok bu kadar kayıt)

stages:                     # run.py --stage ile seçilir; varsayılan sıra
  - kontrol                 # ortam, sağlama toplamları, bilinen sayılar
  - veri                    # analitik tablo ve kohort çıktıları
  - ana                     # S1–S7 × modeller, nested CV
  - duyarlilik              # duyarlılık kolları
  - rapor                   # tablolar, şekiller, manifest, sonuç zip
